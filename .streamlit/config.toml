# Konfigurasi dasar. Yang berhubungan dengan tunnel diatur lewat
# environment di docker-compose.yml, bukan di sini, supaya file ini tetap
# aman dipakai saat menjalankan aplikasi di mesin sendiri.

[server]
headless = true
address = "0.0.0.0"
port = 8501

[browser]
gatherUsageStats = false

[theme]
base = "light"
